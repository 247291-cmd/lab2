<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 2 — Amna Sajjad</title>
  <!-- Task 2: link to stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Task 4: class="hero" on header | Task 5: badge span | Task 6: .behind div -->
  <header class="hero">
    <h1>Amna Sajjad</h1>

    <!-- Task 6: orange block behind the badge -->
    <div class="behind"></div>

    <!-- Task 5: absolute badge -->
    <span id="badge" class="badge">NEW</span>
  </header>

  <!-- Task 1: nav with three links -->
  <nav>
    <a href="#one">One</a>
    <a href="#two">Two</a>
    <a href="#three">Three</a>
  </nav>

  <!-- Task 1: section one -->
  <section id="one">
    <h2>Notice</h2>
    <!-- Task 7: specificity paragraph and button -->
    <p id="status" class="note">Unread</p>
    <button id="mark" type="button">Mark as read</button>
  </section>

  <!-- Task 1 & 8: section two with grid cards -->
  <section id="two" class="cards">
    <article class="card">One</article>
    <article class="card">Two</article>
    <article class="card">Three</article>
  </section>

  <!-- Task 1: section three -->
  <section id="three">
    <h2>Board</h2>
    <p>Air University Kharian Campus</p>
  </section>

  <!-- Task 1: footer -->
  <footer id="contact">
    <p>Roll 247291</p>
  </footer>

  <!-- Task 11: script -->
  <script src="script.js"></script>
</body>
</html>
